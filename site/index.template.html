<style>
/* React + anime.js rebuild. Layout concept: an evidence-room instrument. A sticky control strip drives every panel; the centrepiece is a
   live scatter of real files from the disk that the three models score, flag and either catch or miss evidence in. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface2: #f5f7fa; --ink: #0f1923; --ink2: #4b5a6b; --line: #d3dae3;
  --dot: #8a97a8; --ok: #1b8657; --bad: #c4402c; --warn: #a96a00;
  --m0: #2f6fb8; --m1: #b2791a; --m2: #a23f86;
  --font-d: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-b: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-m: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1016; --surface: #131a23; --surface2: #18212c; --ink: #e8edf3; --ink2: #9baabb; --line: #263341;
  --dot: #66768a; --ok: #3dc189; --bad: #f0705a; --warn: #e0a237;
  --m0: #5a9ae6; --m1: #dba03d; --m2: #d672b6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1016; --surface: #131a23; --surface2: #18212c; --ink: #e8edf3; --ink2: #9baabb; --line: #263341;
  --dot: #66768a; --ok: #3dc189; --bad: #f0705a; --warn: #e0a237;
  --m0: #5a9ae6; --m1: #dba03d; --m2: #d672b6; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-b); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-d); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(34px, 6vw, 60px); line-height: 1.02; font-weight: 700; }
h2 { font-size: clamp(24px, 3.4vw, 34px); line-height: 1.1; font-weight: 700; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; max-width: 66ch; }
a { color: inherit; }
.mono { font-family: var(--font-m); }
.eyebrow { font: 500 11.5px/1 var(--font-m); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); }
.num { font-variant-numeric: tabular-nums; }
section { padding-block: 44px 8px; scroll-margin-top: 112px; }
.sec-head { display: grid; gap: 10px; margin-bottom: 20px; }
.sec-head p { color: var(--ink2); }
header.hero { padding-block: 34px 18px; display: grid; gap: 18px; }
.hero p.lede { font-size: 18px; color: var(--ink2); max-width: 60ch; }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 6px; }
.hstat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.hstat b { font: 700 30px/1 var(--font-d); }
.hstat span { color: var(--ink2); font-size: 13px; }
.dotkey { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* control strip */
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); border-block: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-left, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.strip-in { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.grp { display: flex; align-items: center; gap: 8px; min-width: 0; }
.grp > label, .grp > .lab { font: 500 11px/1 var(--font-m); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: 500 13px var(--font-b); padding: 7px 12px; border: 0; background: transparent; color: var(--ink2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:focus-visible, .btn:focus-visible, input[type=range]:focus-visible, .row:focus-visible { outline: 2px solid var(--m0); outline-offset: 2px; }
.seg.m button[aria-pressed="true"] { color: #fff; }
.budget { flex: 1 1 240px; min-width: 200px; }
.budget input { flex: 1; min-width: 0; accent-color: var(--m0); }
.budget output { font: 500 13px var(--font-m); min-width: 118px; text-align: right; }

/* simulation */
.sim { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0; }
.ticker { height: 26px; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--surface2); position: relative; }
.ticker div { position: absolute; white-space: nowrap; font: 400 11.5px/26px var(--font-m); color: var(--ink2); animation: tick 70s linear infinite; padding-left: 100%; }
@keyframes tick { to { transform: translateX(-100%); } }
canvas { display: block; width: 100%; aspect-ratio: 16 / 10; touch-action: pan-y; cursor: crosshair; }
.phases { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
.phases div { padding: 8px 10px; font: 500 11.5px/1.3 var(--font-m); color: var(--ink2); border-right: 1px solid var(--line); }
.phases div:last-child { border-right: 0; }
.phases div b { display: block; color: var(--ink); font-weight: 500; }
.phases div.on { background: var(--ink); color: var(--bg); } .phases div.on b { color: var(--bg); }
.transport { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
.btn { font: 600 13px var(--font-b); padding: 8px 16px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.transport input { flex: 1; min-width: 0; accent-color: var(--ink); }
.readout { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 14px; position: sticky; top: 104px; }
.big { font: 700 54px/1 var(--font-d); }
.big small { font: 500 18px var(--font-m); color: var(--ink2); margin-left: 4px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 13.5px; }
.kv dt { color: var(--ink2); } .kv dd { margin: 0; text-align: right; font-family: var(--font-m); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink2); padding: 10px 12px; border-top: 1px solid var(--line); }
.tip { position: fixed; pointer-events: none; z-index: 40; background: var(--ink); color: var(--bg); font: 400 12px/1.4 var(--font-m); padding: 6px 9px; border-radius: 5px; max-width: 320px; word-break: break-all; opacity: 0; }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font: 500 11px var(--font-m); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-m); }
.bar { height: 8px; background: var(--surface2); border-radius: 2px; position: relative; min-width: 60px; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; }
.chip { display: inline-block; font: 500 11px var(--font-m); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: var(--ok); } .chip.bad { color: var(--bad); border-color: var(--bad); }
.chip.warn { color: var(--warn); border-color: var(--warn); }
.cardimg h3 { margin-bottom: 4px; } .cardimg .meta { color: var(--ink2); font-size: 13px; margin-bottom: 12px; }
.mrow { display: grid; grid-template-columns: 82px minmax(0, 1fr) 54px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
.mrow .mn { font: 500 12px var(--font-m); }
.mrow.best .mn { font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
svg text { fill: var(--ink2); font: 400 11px var(--font-m); }
svg .gl { stroke: var(--line); stroke-width: 1; }

/* ledger */
.ledger { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.rows { display: grid; max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; background: transparent; border-inline: 0; border-top: 0; text-align: left; font: inherit; color: inherit; width: 100%; }
.row:hover, .row[aria-pressed="true"] { background: var(--surface2); }
.row .ico { width: 14px; height: 14px; border-radius: 50%; }
.row .ico.ok { background: var(--ok); } .row .ico.bad { background: transparent; border: 2px solid var(--bad); }
.row small { display: block; color: var(--ink2); font: 400 11.5px var(--font-m); }
.detail { display: grid; gap: 12px; }
.fbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font: 400 12px var(--font-m); }
.fbar .t { height: 10px; background: var(--surface2); position: relative; border-radius: 2px; }
.fbar .t i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.fbar .t::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.note { color: var(--ink2); font-size: 13.5px; }
.pipe { display: grid; gap: 0; }
.stp { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px 64px; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.stp .ix { font: 500 12px var(--font-m); color: var(--ink2); }
.stp b { font-weight: 600; display: block; } .stp span { color: var(--ink2); font-size: 13px; }
.cav { display: grid; gap: 10px; padding-left: 0; list-style: none; margin: 0; }
.cav li { padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 6px; background: var(--surface); font-size: 14px; }
footer { padding-block: 40px 60px; color: var(--ink2); font-size: 13px; display: grid; gap: 8px; }

@media (max-width: 860px) {
  .sim, .ledger, .two, .three { grid-template-columns: minmax(0, 1fr); }
  .readout { position: static; }
  .hero-stats { grid-template-columns: minmax(0, 1fr); }
  .stp { grid-template-columns: 28px minmax(0, 1fr) 64px; } .stp .bar { display: none; }
  .fbar { grid-template-columns: 110px minmax(0, 1fr) 44px; }
  .budget output { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { .ticker div { animation: none; } }

/* react/anime additions */
.hero-rule { height: 3px; width: 96px; background: linear-gradient(90deg, var(--m0), var(--m1), var(--m2)); border-radius: 2px; transform-origin: left center; }
.callout { display: grid; gap: 8px; align-content: start; }
.callout p { color: var(--ink2); }
.callout b { color: var(--ink); }
.vhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.vbars { display: grid; gap: 6px; }
.vbar { display: grid; grid-template-columns: minmax(150px, 260px) minmax(0, 1fr) 58px; gap: 12px; align-items: center; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid transparent; }
.vbar.rec { border-color: var(--m0); background: var(--surface2); }
.vl { min-width: 0; }
.vt { height: 12px; background: var(--surface2); border-radius: 2px; position: relative; }
.vbar.rec .vt { background: var(--bg); }
.vt i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; }
.vt::after { content: ""; position: absolute; left: 90%; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .6; }
.vv { text-align: right; }
.mrow.wide { grid-template-columns: 150px minmax(0, 1fr) 44px; }
.plain { margin: 0; padding-left: 18px; display: grid; gap: 10px; font-size: 14px; color: var(--ink2); }
.plain b { color: var(--ink); }
td .sub { font-size: 11.5px; color: var(--ink2); }
td .sub.hi { color: var(--ok); }
td.star { background: var(--surface2); }
.abc { display: grid; grid-template-columns: 44px minmax(50px, 1fr); gap: 8px; align-items: center; }
.fcounts { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { display: inline-flex; align-items: center; gap: 8px; }
.bar.mini { width: 54px; min-width: 54px; height: 6px; }
.csum { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer; }
.cev { margin: 8px 0 2px 96px; max-width: none; }
.rows > .row { flex: none; }
@media (max-width: 860px) {
  .vbar { grid-template-columns: minmax(0, 1fr) 54px; } .vbar .vl { grid-column: 1 / -1; }
  .mrow.wide { grid-template-columns: 110px minmax(0, 1fr) 40px; }
  .cev { margin-left: 0; }
}
</style>

<script>
(function () {
  var React = window.React, ReactDOM = window.ReactDOM, htm = window.htm;
  var AN = window.anime || null;
  var html = htm.bind(React.createElement);
  var useState = React.useState, useEffect = React.useEffect, useLayoutEffect = React.useLayoutEffect, useRef = React.useRef, useMemo = React.useMemo;

  var D = JSON.parse(document.getElementById('data').textContent);
  var X = JSON.parse(document.getElementById('extras').textContent || '{}');
  var MODELS = D.models, SHORT = ['Isolation Forest', 'LOF', 'One-Class SVM'];
  var MVAR = ['--m0', '--m1', '--m2'];
  var IMGS = Object.keys(D.images);
  var SW = X.sweep || {};

  var RM = function () { return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); };
  var canAnim = function () { return !!AN && !RM(); };
  var fmt = function (n) { return Number(n).toLocaleString('en-US'); };
  var pc = function (x, d) { return (x * 100).toFixed(d == null ? 1 : d) + '%'; };
  var short = function (l) { return l.split(':')[0]; };
  var css = function (v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };
  var hitsFmt = function (h) { return Number.isInteger(h) ? String(h) : h.toFixed(1); };
  var frac = function (s) { var p = String(s).split('/'); return parseInt(p[0], 10) / parseInt(p[1], 10); };

  /* ================= animation hooks ================= */

  /* Calls fn once, the first time ref's element scrolls into view. fn may return a cleanup. Never fires without anime / when motion is reduced. */
  function useOnceInView(ref, fn) {
    var f = useRef(fn); f.current = fn;
    var stop = useRef(null);
    useEffect(function () {
      if (!canAnim() || !window.IntersectionObserver || !ref.current) return;
      var io = new IntersectionObserver(function (es) {
        if (es.some(function (e) { return e.isIntersecting; })) { io.disconnect(); stop.current = f.current(); }
      }, { rootMargin: '0px 0px -6% 0px' });
      io.observe(ref.current);
      return function () { io.disconnect(); if (typeof stop.current === 'function') stop.current(); };
    }, []);
  }

  /* Bars marked [data-grow] with data-w=<percent> and a rendered final width grow from 0 with a stagger: on first view and whenever deps change. */
  function useGrow(ref, deps) {
    var seen = useRef(false);
    var run = function () {
      var root = ref.current; if (!root || !canAnim()) return;
      var els = root.querySelectorAll('[data-grow]'); if (!els.length) return;
      AN.remove(els); AN.set(els, { width: '0%' });
      AN({ targets: els, width: function (el) { return el.dataset.w + '%'; }, duration: 800, delay: AN.stagger(28, { start: 120 }), easing: 'easeOutCubic' });
    };

    useLayoutEffect(function () { if (seen.current) run(); }, deps);
  }

  /* SVG polylines with class "draw" draw in with strokeDashoffset; dashed lines get their dash pattern back afterwards. */
  function useDraw(ref, deps) {
    var seen = useRef(false);
    var run = function () {
      var root = ref.current; if (!root || !canAnim()) return;
      var ps = root.querySelectorAll('.draw'); if (!ps.length) return;
      var fades = root.querySelectorAll('.fadein');
      AN.remove(ps);
      AN.set(fades, { opacity: 0 });
      AN({ targets: ps, strokeDashoffset: [AN.setDashoffset, 0], duration: 1300, delay: AN.stagger(140), easing: 'easeInOutSine',
        complete: function () { ps.forEach(function (p) { p.removeAttribute('stroke-dashoffset'); var d = p.getAttribute('data-dash'); if (d) p.setAttribute('stroke-dasharray', d); else p.removeAttribute('stroke-dasharray'); }); } });
      if (fades.length) AN({ targets: fades, opacity: function (el) { return [0, +(el.getAttribute('data-op') || 1)]; }, duration: 700, delay: 900, easing: 'easeOutQuad' });
    };
    useOnceInView(ref, function () { seen.current = true; run(); return function () { if (ref.current && AN) AN.remove(ref.current.querySelectorAll('.draw, .fadein')); }; });
    useLayoutEffect(function () { if (seen.current) run(); }, deps);
  }

  /* Number that tweens to its new value. */
  function Num(props) {
    var ref = useRef(), cur = useRef({ v: null }), fr = useRef(props.fmt), anim = useRef(null);
    fr.current = props.fmt || String;
    useLayoutEffect(function () {
      var el = ref.current, o = cur.current, v = props.value, intro = props.intro;
      if (anim.current && AN) AN.remove(o);
      if (!canAnim() || (o.v === null && !intro)) { o.v = v; el.textContent = fr.current(v); return; }
      if (o.v === null) o.v = 0;
      el.textContent = fr.current(o.v);
      anim.current = AN({ targets: o, v: v, duration: intro ? 1400 : 650, delay: intro ? (props.delay || 0) : 0, easing: 'easeOutCubic',
        update: function () { el.textContent = fr.current(o.v); }, complete: function () { el.textContent = fr.current(v); } });
    }, [props.value]);

  }

  /* Section: .rv children fade/slide in once when the section first scrolls into view. */
  function Section(props) {
    var ref = useRef();
    useLayoutEffect(function () {
      if (!canAnim() || !window.IntersectionObserver) return;
      var els = ref.current.querySelectorAll('.rv'); if (!els.length) return;
      AN.set(els, { opacity: 0, translateY: 18 });
      var io = new IntersectionObserver(function (es) {
        if (!es.some(function (e) { return e.isIntersecting; })) return;

    }, []);

  }

  function Seg(props) {
    return html`<div className=${'seg' + (props.colored ? ' m' : '')} role="group" aria-label=${props.label}>${props.items.map(function (t, i) {

    })}</div>`;

  /* ================= hero ================= */
  function Hero() {
    var ref = useRef();
    var info = useMemo(function () {
      var tot = IMGS.reduce(function (a, t) { return a + D.images[t].files; }, 0), best = [0, 0, 0];

          <p className="note" style=${{ marginBottom: 12 }}>It came from the original 17-feature Isolation Forest on Image 2. A fresh rerun of that same model reaches 90% at about ${r17}%: ${c17 ? c17.r.toFixed(1) : '93.7'}% at 21%, ${c17b ? c17b.r.toFixed(1) : '94.7'}% at 25%, and 100% only at ${r17f}%. With 23 features the same model needs only 15%. The 6 new features are what cut the budget.</p>
          <div className="eyebrow" style=${{ marginBottom: 8 }}>Smallest budget reaching 90% recall</div>
          ${rb.map(function (b) { return html`<div key=${b.n} className="mrow wide"><span className="mn">${b.n}</span><div className="bar"><i data-grow="1" data-w=${b.w / 30 * 100} style=${{ width: (b.w / 30 * 100) + '%', background: 'var(' + b.v + ')' }}></i></div><span className="num mono">${b.w}%</span></div>`; })}
        </div>
        <div className="panel">
          <h3 style=${{ marginBottom: 8 }}>The other two models</h3>
          <ul className="plain">
            <li><b>One-Class SVM on Image 3</b> reaches only ${(cell('img3', 'OCSVM-23', 15) || { r: 80.6 }).r.toFixed(1)}% at 15% and needs about ${oc3}% to reach 90%. On Image 2 it is perfect at every budget.</li>
            <li><b>LOF</b> never reaches 90% below about ${Math.round(lofMin / 10) * 10}%, so it is not a practical choice at any budget an examiner would accept.</li>
            <li><b>The simple rule:</b> if you can read only 5% of files, use One-Class SVM. If you can read 15%, use Isolation Forest on all 23 features.</li>
          </ul>
        </div>
      </div>
      <div className="panel scroll-x rv" style=${{ marginTop: 16 }}>
        <h3 style=${{ marginBottom: 10 }}>Recall at budget</h3>
        <table><thead><tr><th>Disk · model</th>${COLS.map(function (c) { return html`<th key=${c} className="n">${c}%</th>`; })}</tr></thead><tbody>${VROWS.filter(function (r) { return r.table; }).map(function (r) {
          return html`<tr key=${r.img + r.cfg}><td><i className="dotkey" style=${{ background: 'var(' + r.v + ')' }}></i>${r.name}</td>${COLS.map(function (c) {
            var x = cell(r.img, r.cfg, c);
            if (!x) return html`<td key=${c} className="n">–</td>`;
            return html`<td key=${c} className=${'n' + (c === 15 && r.cfg === 'IF-23' ? ' star' : '')}><div>${hitsFmt(x.h)}/${x.n}</div><div className=${'sub' + (x.r >= 90 ? ' hi' : '')}>${x.r.toFixed(1)}%${x.s >= 1 ? ' ±' + x.s.toFixed(1) : ''}</div></td>`;
          })}</tr>`;
        })}</tbody></table>
        <p className="note" style=${{ marginTop: 10 }}>Hits are the mean number of evidence targets found over 5 runs, each with 10% of ordinary files dropped at random. Green percentages are at or above 90%. The shaded column is the recommended 15% budget.</p>
      </div>
    <//>`;
  }

  /* ================= recall curve + metrics ================= */
  function Curve(p) {
    var im = p.im, ref = useRef(), W = 560, H = 320, L = 44, R = 118, T = 14, B = 34, pw = W - L - R, ph = H - T - B;
    var Xs = function (v) { return L + (v / 0.2) * pw; }, Ys = function (v) { return T + (1 - v) * ph; };
    useDraw(ref, [p.img]);
    var ends = MODELS.map(function (m, i) { return { i: i, y: Ys(im.curves[m][im.curves[m].length - 1]) }; }).sort(function (a, b) { return a.y - b.y; });
    for (var j = 1; j < ends.length; j++) if (ends[j].y - ends[j - 1].y < 15) ends[j].y = ends[j - 1].y + 15;
    var cx = Xs(p.pct), jj = 0; while (jj < D.pcts.length - 1 && D.pcts[jj + 1] <= p.pct + 1e-9) jj++;
    return html`<div ref=${ref}><svg viewBox=${'0 0 ' + W + ' ' + H} width="100%" role="img" aria-label="Recall versus review budget for three models">
      ${[0, .25, .5, .75, 1].map(function (v) { return html`<g key=${v}><line className="gl" x1=${L} x2=${W - R} y1=${Ys(v)} y2=${Ys(v)} /><text x=${L - 8} y=${Ys(v) + 4} textAnchor="end">${Math.round(v * 100)}%</text></g>`; })}
      ${[0, .05, .1, .15, .2].map(function (v) { return html`<text key=${v} x=${Xs(v)} y=${H - 12} textAnchor="middle">${Math.round(v * 100)}%</text>`; })}
      <text x=${L + pw / 2} y=${H} textAnchor="middle">review budget (share of files read)</text>
      ${MODELS.map(function (m, i) {
        var pts = D.pcts.map(function (v, k) { return Xs(v).toFixed(1) + ',' + Ys(im.curves[m][k]).toFixed(1); }).join(' ');
        return html`<polyline key=${m} className="draw" fill="none" stroke=${'var(' + MVAR[i] + ')'} strokeWidth=${i === p.m ? 3.2 : 1.8} opacity=${i === p.m ? 1 : .75} points=${pts} />`;
      })}
      ${ends.map(function (e) { return html`<text key=${e.i} className="fadein" x=${W - R + 8} y=${e.y + 4} style=${{ fill: 'var(' + MVAR[e.i] + ')', fontWeight: 500 }}>${SHORT[e.i]}</text>`; })}
      <line x1=${cx} x2=${cx} y1=${T} y2=${H - B} stroke="var(--ink)" strokeDasharray="4 4" />
      ${MODELS.map(function (m, i) { return html`<circle key=${m} cx=${cx} cy=${Ys(im.curves[m][jj])} r="4.5" fill=${'var(' + MVAR[i] + ')'} stroke="var(--surface)" strokeWidth="1.5" />`; })}
    </svg></div>`;
  }

  function Recall(p) {
    var im = p.im, ref = useRef(), allRef = useRef();
    useGrow(allRef, []);
    return html`<${Section} id="recall">
      <div className="sec-head rv"><div className="eyebrow">Results</div><h2>How much evidence for how much reading?</h2>
        <p>Recall of the evidence targets as the examiner is allowed to read more files. The dashed line is the budget you chose above.</p></div>
      <div className="two rv">
        <div className="panel"><${Curve} im=${im} img=${p.img} m=${p.m} pct=${p.pct} /></div>
        <div className="panel"><h3 style=${{ marginBottom: 10 }}>${short(im.label)} at the 5% budget (${fmt(im.K5)} of ${fmt(im.files)} files)</h3>
          <div className="scroll-x"><table><thead><tr><th>Model</th><th className="n">Targets</th><th className="n">Recall</th><th className="n">Precision</th><th className="n">F1</th><th className="n">Accuracy</th></tr></thead><tbody>${MODELS.map(function (m, i) {
            var x = im.metrics[m];
            return html`<tr key=${m}><td><i className="dotkey" style=${{ background: 'var(' + MVAR[i] + ')' }}></i>${SHORT[i]}</td><td className="n">${x.targets}</td><td className="n">${pc(x.target_recall)}</td><td className="n">${pc(x.precision, 2)}</td><td className="n">${pc(x.f1, 2)}</td><td className="n">${pc(x.accuracy, 2)}</td></tr>`;
          })}</tbody></table></div>
          <p className="note" style=${{ marginTop: 10 }}>Accuracy sits near 95% for every model by construction: a fixed 5% budget on rare evidence. Recall, precision and F1 are the numbers that separate the models.</p></div>
      </div>
      <h3 className="rv" style=${{ margin: '26px 0 12px' }}>All three disks at the 5% budget</h3>
      <div className="three rv" ref=${allRef}>${IMGS.map(function (t) {
        var x = D.images[t], best = Math.max.apply(null, MODELS.map(function (m) { return parseFloat(x.metrics[m].target_recall); }));
        return html`<div key=${t} className="panel cardimg"><h3>${short(x.label)}</h3><div className="meta">${x.label.split(': ')[1] || ''} · ${fmt(x.files)} files · ${x.targets.length} targets</div>
          ${MODELS.map(function (m, i) {
            var r = parseFloat(x.metrics[m].target_recall);
            return html`<div key=${m} className=${'mrow' + (r === best ? ' best' : '')}><span className="mn">${SHORT[i]}</span><div className="bar"><i data-grow="1" data-w=${r * 100} style=${{ width: (r * 100) + '%', background: 'var(' + MVAR[i] + ')' }}></i></div><span className="num mono">${x.metrics[m].targets}</span></div>`;
          })}</div>`;
      })}</div>
    <//>`;
  }

  /* ================= findings ================= */
  function Findings(p) {
    var im = p.im;
    return html`<${Section} id="verdicts">
      <div className="sec-head rv"><div className="eyebrow">Findings</div><h2>Timestomping and insider attack</h2>
        <p>${im.scenario === 'external'
          ? 'This disk is an outside intrusion, so the insider-attack test does not apply. Timestomping is confirmed only when a known timestomped file is flagged.'
          : 'Insider attack is called when at least half of the evidence targets are flagged. Timestomping is confirmed only when a known timestomped file is flagged; otherwise it is unverified.'}</p></div>
      <div className="panel scroll-x rv"><table><thead><tr><th>Model</th><th>Timestomping</th><th>Known timestomped file flagged</th><th className="n">$SI vs $FN mismatches in flagged set</th><th>Insider attack</th></tr></thead><tbody>${MODELS.map(function (m, i) {
        var v = im.verdicts[m], ts = v.timestomp, cls = ts === 'YES' ? 'ok' : ts === 'NO' ? 'bad' : 'warn', ia = v.insider, ic = /CONFIRMED/.test(ia) ? 'ok' : /NOT/.test(ia) ? 'bad' : 'warn';
        return html`<tr key=${m}><td><i className="dotkey" style=${{ background: 'var(' + MVAR[i] + ')' }}></i>${SHORT[i]}</td><td><span className=${'chip ' + cls}>${ts}</span></td><td>${v.known_ts_hit && v.known_ts_hit.length ? v.known_ts_hit.join(', ') : '–'}</td><td className="n">${fmt(v.si_fn_mismatch_flagged || 0)}</td><td><span className=${'chip ' + ic}>${ia}</span></td></tr>`;
      })}</tbody></table><p className="note" style=${{ marginTop: 10 }}>A mismatch between the two timestamp sets is a hint of tampering, not proof: ordinary file operations also cause it.</p></div>
    <//>`;
  }

  /* ================= evidence ledger + SHAP ================= */
  function Detail(p) {
    var im = p.im, m = MODELS[p.m], t = im.targets.filter(function (x) { return x.name === p.sel; })[0], ref = useRef();
    useGrow(ref, [p.sel, p.m, p.img]);
    if (!t) return html`<div className="panel detail" ref=${ref}><p className="note">Select an evidence target.</p></div>`;
    var ok = t.ranks[m] <= p.K, drivers = t.shap[m] || t.shap[MODELS[0]], from = t.shap[m] ? SHORT[p.m] : SHORT[0];
    var mx = drivers && drivers.length ? (Math.max.apply(null, drivers.map(function (d) { return Math.abs(d[1]); })) || 1) : 1;
    return html`<div className="panel detail" ref=${ref}>
      <div><span className=${'chip ' + (ok ? 'ok' : 'bad')}>${ok ? 'caught' : 'missed'} at ${pc(p.pct)}</span></div>
      <h3>${t.name}</h3><div className="mono note" style=${{ wordBreak: 'break-all' }}>${t.path}</div>
      <dl className="kv"><dt>Rank under ${SHORT[p.m]}</dt><dd>#${fmt(t.ranks[m])} of ${fmt(im.files)}</dd><dt>Smallest budget that catches it</dt><dd>${pc(t.ranks[m] / im.files, 2)}</dd></dl>
      ${drivers && drivers.length ? html`<div><div className="eyebrow" style=${{ marginBottom: 8 }}>Top drivers (${from} SHAP)</div>${drivers.map(function (d) {
        var w = Math.abs(d[1]) / mx * 50, pos = d[1] >= 0, st = { width: w + '%', background: pos ? 'var(--ok)' : 'var(--bad)' };
        if (pos) st.left = '50%'; else st.right = '50%';
        return html`<div key=${d[0]} className="fbar"><span>${d[0]}</span><span className="t"><i data-grow="1" data-w=${w} style=${st}></i></span><span className="num">${d[1] > 0 ? '+' : ''}${d[1].toFixed(2)}</span></div>`;
      })}</div><p className="note">Positive values pushed this file up the suspicion ranking. Generic features such as <span className="mono">is_shortcut_or_trace</span> also fire on harmless files, so a high value is a reason for the rank, not proof of intent.</p>`
        : html`<p className="note">No SHAP breakdown was computed for this file under this model: SHAP ran only on files the model flagged.</p>`}
    </div>`;
  }
  function Evidence(p) {
    var im = p.im, m = MODELS[p.m];
    var tg = im.targets.slice().sort(function (a, b) { return a.ranks[m] - b.ranks[m]; });
    return html`<${Section} id="evidence">
      <div className="sec-head rv"><div className="eyebrow">Evidence ledger and SHAP</div><h2>Which evidence, and why did the model flag it?</h2>
        <p>Each row is one evidence target. Pick one to see the features that pushed it up the ranking. SHAP explains the ranking, not intent: ordinary files can score the same way.</p></div>
      <div className="ledger rv"><div className="rows">${tg.map(function (t) {
        var ok = t.ranks[m] <= p.K;
        return html`<button key=${t.name} className="row" type="button" aria-pressed=${p.sel === t.name} onClick=${function () { p.setSel(t.name); }}><span className=${'ico ' + (ok ? 'ok' : 'bad')}></span><span>${t.name}<small>${t.copies} cop${t.copies > 1 ? 'ies' : 'y'} on disk</small></span><span className="mono num">#${fmt(t.ranks[m])}</span></button>`;
      })}</div><${Detail} im=${im} m=${p.m} K=${p.K} pct=${p.pct} sel=${p.sel} img=${p.img} /></div>
    <//>`;
  }

  /* ================= pipeline + ablation + caveats ================= */
  function Pipeline(p) {
    var tm = p.im.stage_times, ref = useRef(), mx = Math.sqrt(Math.max.apply(null, D.pipeline.map(function (s) { return tm[s.script] || 0; })) || 1), tot = 0;
    useGrow(ref, [p.img]);
    var rows = D.pipeline.map(function (s, i) {
      var v = tm[s.script] || 0; tot += v;
      return html`<div key=${s.script} className="stp"><span className="ix">${String(i + 1).padStart(2, '0')}</span><div><b>${s.title}</b><span>${s.desc}</span></div><div className="bar"><i data-grow="1" data-w=${Math.sqrt(v) / mx * 100} style=${{ width: (Math.sqrt(v) / mx * 100) + '%', background: 'var(--m0)' }}></i></div><span className="num mono">${v.toFixed(1)}s</span></div>`;
    });
    return html`<${Section} id="pipeline">
      <div className="sec-head rv"><div className="eyebrow">Pipeline</div><h2>The 12 stages behind every result</h2><p>Measured run times for the selected disk, from the raw image to the report.</p></div>
      <div className="panel pipe rv" ref=${ref}>${rows}<div className="stp" style=${{ borderBottom: 0 }}><span></span><b>Total</b><span></span><span className="num mono">${tot.toFixed(0)}s</span></div></div>
    <//>`;
  }
  function Ablation(p) {
    var ref = useRef();
    useGrow(ref, [p.img]);
    return html`<${Section} id="ablation">
      <div className="sec-head rv"><div className="eyebrow">Ablation</div><h2>Which features carry the result?</h2><p>Targets caught at the 5% budget with feature groups removed or kept alone, for the selected disk.</p></div>
      <div className="panel scroll-x rv" ref=${ref}><table><thead><tr><th>Feature set</th><th className="n">Features</th>${SHORT.map(function (n, i) { return html`<th key=${n}><i className="dotkey" style=${{ background: 'var(' + MVAR[i] + ')' }}></i>${n}</th>`; })}</tr></thead><tbody>${p.im.ablation.map(function (r) {
        var strong = /^Full \(/.test(r.config) || /^Legacy/.test(r.config);
        return html`<tr key=${r.config} style=${strong ? { background: 'var(--surface2)' } : undefined}><td>${r.config}</td><td className="n">${r.n}</td>${MODELS.map(function (m, i) {
          return html`<td key=${m}><div className="abc"><span className="num mono">${r[m]}</span><div className="bar"><i data-grow="1" data-w=${frac(r[m]) * 100} style=${{ width: (frac(r[m]) * 100) + '%', background: 'var(' + MVAR[i] + ')' }}></i></div></div></td>`;
        })}</tr>`;
      })}</tbody></table></div>
    <//>`;
  }

  /* ================= threshold stability ================= */
  var CFG = [['IF-23', '--m0', '', 'IF · 23'], ['LOF-23', '--m1', '', 'LOF · 23'], ['OCSVM-23', '--m2', '', 'OC-SVM · 23'], ['IF-17', '--ink2', '5 4', 'IF · 17']];
  function Stability(p) {
    var sw = SW[p.img], ref = useRef();
    useDraw(ref, [p.img]);
    var head = html`<div className="sec-head rv"><div className="eyebrow">Threshold stability</div><h2>Is there a review budget that holds up?</h2>
      <p>Each model was rerun five times with 10% of ordinary files dropped at random, in three separate randomizations. The lines show mean evidence recall from a 5% to a 100% budget; the bands show the spread across runs. The legacy XP disk is excluded.</p></div>`;
    if (!sw) return html`<${Section} id="stability">${head}<div className="two rv"><div className="panel"><p className="note">The legacy XP disk is excluded from this study. Pick Image 2 or Image 3.</p></div></div><//>`;
    var W = 560, H = 320, L = 44, R = 150, T = 14, B = 34, pw = W - L - R, ph = H - T - B;
    var Xs = function (v) { return L + (v / 100) * pw; }, Ys = function (v) { return T + (1 - v / 100) * ph; };
    var ends = [];
    CFG.forEach(function (c) {
      var d = sw[c[0]]; if (!d) return;
      var j = d.pct.findIndex(function (v) { return v >= 20; }); if (j < 0) j = d.pct.length - 1;
      ends.push({ c: c, y: Ys(d.recall[j]) });
    });
    ends.sort(function (a, b) { return a.y - b.y; });
    for (var j = 1; j < ends.length; j++) if (ends[j].y - ends[j - 1].y < 15) ends[j].y = ends[j - 1].y + 15;
    var cx = Xs(p.pct * 100), i5 = function (d) { return d.pct.indexOf(5); }, a = sw['IF-23'], o = sw['OCSVM-23'];
    return html`<${Section} id="stability">${head}
      <div className="two rv">
        <div className="panel" ref=${ref}><svg viewBox=${'0 0 ' + W + ' ' + H} width="100%" role="img" aria-label="Mean recall versus review budget across randomized runs">
          ${[0, 25, 50, 75, 100].map(function (v) { return html`<g key=${v}><line className="gl" x1=${L} x2=${W - R} y1=${Ys(v)} y2=${Ys(v)} /><text x=${L - 8} y=${Ys(v) + 4} textAnchor="end">${v}%</text><text x=${Xs(v)} y=${H - 12} textAnchor="middle">${v}%</text></g>`; })}
          <text x=${L + pw / 2} y=${H} textAnchor="middle">review budget</text>
          ${CFG.map(function (c) {
            var d = sw[c[0]]; if (!d) return null;
            var up = d.pct.map(function (v, i) { return Xs(v).toFixed(1) + ',' + Ys(Math.min(100, d.recall[i] + d.std[i])).toFixed(1); });
            var dn = d.pct.map(function (v, i) { return Xs(v).toFixed(1) + ',' + Ys(Math.max(0, d.recall[i] - d.std[i])).toFixed(1); }).reverse();
            return html`<g key=${c[0]}><polygon className="fadein" data-op="0.12" points=${up.concat(dn).join(' ')} fill=${'var(' + c[1] + ')'} opacity="0.12" />
              <polyline className="draw" data-dash=${c[2]} fill="none" stroke=${'var(' + c[1] + ')'} strokeWidth="2.2" strokeDasharray=${c[2] || undefined} points=${d.pct.map(function (v, i) { return Xs(v).toFixed(1) + ',' + Ys(d.recall[i]).toFixed(1); }).join(' ')} /></g>`;
          })}
          ${ends.map(function (e) { return html`<text key=${e.c[0]} className="fadein" x=${W - R + 8} y=${Math.min(H - B, e.y) + 4} style=${{ fill: 'var(' + e.c[1] + ')', fontWeight: 500 }}>${e.c[3]}</text>`; })}
          <line x1=${cx} x2=${cx} y1=${T} y2=${H - B} stroke="var(--ink)" strokeDasharray="4 4" />
        </svg></div>
        <div className="panel"><h3 style=${{ marginBottom: 10 }}>Smallest budget reaching 90% recall</h3>
          <div className="scroll-x"><table><thead><tr><th>Model (features)</th><th className="n">Run set 1</th><th className="n">Run set 2</th><th className="n">Run set 3</th><th>Agree?</th><th className="n">Thresholds agreeing</th></tr></thead><tbody>${CFG.map(function (c) {
            var d = sw[c[0]]; if (!d) return null;
            var g = d.ge90 || {}, cellv = function (k) { return g[k] == null ? 'never' : g[k] + '%'; };
            return html`<tr key=${c[0]}><td><i className="dotkey" style=${{ background: 'var(' + c[1] + ')' }}></i>${d.label}</td><td className="n">${cellv('R1')}</td><td className="n">${cellv('R2')}</td><td className="n">${cellv('R3')}</td><td><span className=${'chip ' + (d.agree90 ? 'ok' : 'warn')}>${d.agree90 ? 'yes' : 'no'}</span></td><td className="n">${d.agreement || '–'}</td></tr>`;
          })}</tbody></table></div>
          <p className="note" style=${{ marginTop: 10 }}>${a && o ? 'At 5% Isolation Forest catches ' + a.hits[i5(a)] + ' of ' + a.targets + ' targets on average and One-Class SVM ' + o.hits[i5(o)] + '. Full recall at a 5.5% budget is not a general result: only One-Class SVM on Image 2 reaches it.' : ''}</p></div>
      </div>
    <//>`;
  }

  /* ================= feature firing ================= */
  function ChipFor(p) {
    var st = p.st;
    if (!st) return html`<span className="note">–</span>`;
    var cls = st.status === 'fired' ? 'ok' : st.status === 'not fired' ? 'bad' : 'warn';
    return html`<span><span className=${'chip ' + cls}>${st.status}</span> <span className="mono num note">${st.shap.toFixed(3)}</span></span>`;
  }
  function Firing(p) {
    var f = (X.firing || {})[p.img], ref = useRef();
    useGrow(ref, [p.img]);
    var rows = f ? f.features.slice().sort(function (a, b) { return ((b.s23 || {}).shap || 0) - ((a.s23 || {}).shap || 0); }) : [];
    return html`<${Section} id="firing">
      <div className="sec-head rv"><div className="eyebrow">SHAP feature firing</div><h2>Which features does the model actually use?</h2>
        <p>A feature "fires" when its mean SHAP value is above zero. Features that never vary across files can never fire, whatever happened on the disk.</p></div>
      <div className="panel rv" style=${{ display: 'grid', gap: 14 }} ref=${ref}>
        ${f ? html`<div className="fcounts">${f.counts.map(function (c, i) {
          return html`<span key=${i} className="chip fchip"><span>${c.set} features · ${c.model}: <b>${c.fired}</b> of ${c.of} fired</span><span className="bar mini"><i data-grow="1" data-w=${c.fired / c.of * 100} style=${{ width: (c.fired / c.of * 100) + '%', background: 'var(--m0)' }}></i></span></span>`;
        })}</div>
        <div className="scroll-x"><table><thead><tr><th>Feature</th><th>Original 17</th><th>23-feature set</th><th className="n">Files non-zero</th><th>Why</th></tr></thead><tbody>${rows.map(function (r) {
          var cause = (r.s23 || r.s17 || {}).cause || '';
          return html`<tr key=${r.feature}><td className="mono">${r.feature}${r.constant ? html` <span className="chip bad">constant</span>` : null}</td><td><${ChipFor} st=${r.s17} /></td><td><${ChipFor} st=${r.s23} /></td><td className="n">${r.nonzero_pct}%</td><td style=${{ fontSize: '12.5px', color: 'var(--ink2)', minWidth: 280 }}>${cause.length > 230 ? cause.slice(0, 227) + '…' : cause}</td></tr>`;
        })}</tbody></table></div>` : null}
      </div>
    <//>`;
  }

  /* ================= claims audit ================= */
  function Audit() {
    var _f = useState(0), af = _f[0], setAf = _f[1], all = X.claims || [];
    var list = all.filter(function (c) { return af === 0 || (af === 1 ? c.verdict === 'FALSE' : c.verdict === 'TRUE'); });
    var nf = all.filter(function (c) { return c.verdict === 'FALSE'; }).length;
    return html`<${Section} id="audit">
      <div className="sec-head rv"><div className="eyebrow">Earlier claims checked</div><h2>What the earlier results got right and wrong</h2>
        <p>Each claim from the earlier results was re-tested against this run. Many earlier Image 1 numbers matched an older, buggier version of the pipeline; others were not produced by any code.</p></div>
      <div className="rv" style=${{ display: 'flex', flexWrap: 'wrap', gap: 10, alignItems: 'center', marginBottom: 12 }}>
        <${Seg} label="Filter claims" items=${['All', 'Wrong', 'Correct']} value=${af} onPick=${setAf} /><span className="note">${nf} of ${all.length} checked claims did not hold up.</span></div>
      <div className="rows rv" style=${{ maxHeight: 620 }}>${list.map(function (c, i) {
        var ok = c.verdict === 'TRUE', cls = ok ? 'ok' : c.verdict === 'FALSE' ? 'bad' : 'warn';
        return html`<details key=${c.claim + i} className="row" style=${{ display: 'block', cursor: 'default' }}><summary className="csum"><span className=${'chip ' + cls}>${ok ? 'correct' : c.verdict === 'FALSE' ? 'wrong' : c.verdict.toLowerCase()}</span><span>${c.claim}<small>${c.area}</small></span></summary><p className="note cev">${c.evidence}</p></details>`;
      })}</div>
    <//>`;
  }

  function Limits(p) {
    var im = p.im, c = im.constant || [], rb = im.robustness || {};
    return html`<${Section} id="limits">
      <div className="sec-head rv"><div className="eyebrow">Read before citing</div><h2>What these numbers do not show</h2></div>
      <ul className="cav rv">
        ${c.length ? html`<li><b>${c.length} of the 23 features never vary on this disk</b> (${c.join(', ')}), so the models use ${im.features.length - c.length} active features. <span className="mono">future_m</span> can never fire because its reference time is the newest timestamp on the same disk.</li>` : null}
        <li><b>Targets are not an official answer key everywhere.</b> Disk 1 targets are rebuilt from case notes, disk 2 from the repository's CFReDS list, and disk 3 from the scenario author's own published examiner tags, because the official answer key for that scenario is access-restricted.</li>
        <li><b>The best model depends on the budget.</b> One-Class SVM leads at a strict 5% budget; Isolation Forest on 23 features leads from about 15%. Neither result is a claim about every disk.</li>
        <li><b>One-Class SVM trains on a 10,000-file subsample</b> and then scores every file. Its recall held across five subsample seeds${rb.ocsvm ? ' (' + Object.keys(rb.ocsvm).map(function (n) { var v = rb.ocsvm[n]; return 'n=' + fmt(n) + ': ' + Math.min.apply(null, v) + '–' + Math.max.apply(null, v) + ' targets'; }).join('; ') + ')' : ''}.</li>
        ${rb.lof ? html`<li><b>LOF is sensitive to its neighbour count and is weakest at every setting tried</b> (${Object.keys(rb.lof).map(function (k) { return 'k=' + k + ': ' + rb.lof[k]; }).join(', ')} targets). Duplicate feature rows distort it (${fmt(rb.unique_rows)} unique of ${fmt(rb.rows)} rows).</li>` : null}
        <li><b>SHAP explains the ranking, not intent.</b> Shortcut and log files score highly whether or not they relate to the case.</li>
        <li><b>Time-of-day features use UTC</b> (08:00 to 18:00 working hours); the disk's own time zone is not applied.</li>
      </ul>
    <//>`;
  }

  /* ================= app ================= */
  function App() {
    var _i = useState(IMGS[0]), img = _i[0], setImgRaw = _i[1];
    var _m = useState(2), m = _m[0], setM = _m[1];
    var _p = useState(0.05), pct = _p[0], setPct = _p[1];
    var _s = useState(null), selRaw = _s[0], setSel = _s[1];
    var tipRef = useRef();
    var im = D.images[img], K = Math.max(1, Math.round(pct * im.files));
    var sel = useMemo(function () {
      if (selRaw && im.targets.some(function (t) { return t.name === selRaw; })) return selRaw;
      var tg = im.targets.slice().sort(function (a, b) { return a.ranks[MODELS[m]] - b.ranks[MODELS[m]]; });
      return tg.length ? tg[0].name : null;
    }, [selRaw, img, m]);
    var setImg = function (i) { setImgRaw(i); setSel(null); };
    return html`<${React.Fragment}>
      <${Hero} />
      <${Strip} img=${img} m=${m} pct=${pct} K=${K} setImg=${setImg} setM=${setM} setPct=${setPct} />
      <div className="wrap">
        <${Simulation} img=${img} im=${im} m=${m} K=${K} sel=${sel} tipRef=${tipRef} />
        <${Verdict} />
        <${Recall} img=${img} im=${im} m=${m} pct=${pct} />
        <${Findings} im=${im} />
        <${Evidence} img=${img} im=${im} m=${m} K=${K} pct=${pct} sel=${sel} setSel=${setSel} />
        <${Pipeline} img=${img} im=${im} />
        <${Ablation} img=${img} im=${im} />
        <${Stability} img=${img} pct=${pct} />
        <${Firing} img=${img} />
        <${Audit} />
        <${Limits} im=${im} />
        <footer>
          <div>Disk images: NIST CFReDS Hacking Case (SCHARDT), NIST CFReDS Data Leakage Case, Digital Corpora 2018 Lone Wolf scenario. Every figure comes from one scripted run (<span className="mono">multimodel_eval.py</span>) over artifacts extracted directly from the raw images.</div>
        </footer>
      </div>
      <div className="tip" ref=${tipRef}></div>
    <//>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
